<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Iniciar sesión
    </title>


    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilos.css') }}"
    >

    <style>
    /* =====================================================
       AJUSTES EXCLUSIVOS DEL LOGIN
       NO AFECTA LAS DEMÁS PÁGINAS
    ===================================================== */

    .pagina-formulario .formulario-contenedor {
        width: min(520px, 100%);
        padding: 22px 30px 25px;
        text-align: center;
    }

    .pagina-formulario .logo-formulario {
        width: 170px !important;
        height: 170px !important;
        object-fit: contain !important;
        display: block !important;
        margin: 0 auto 5px !important;
    }

    .pagina-formulario .formulario-contenedor h1 {
        margin: 3px 0 3px;
        font-size: 25px;
    }

    .pagina-formulario .formulario-contenedor h2 {
        margin: 0 0 10px;
        font-size: 18px;
    }

    .pagina-formulario .formulario-contenedor form {
        display: flex !important;
        flex-direction: column !important;
        gap: 8px !important;
        width: 100%;
    }

    .pagina-formulario .formulario-contenedor label {
        display: block;
        width: 100%;
        text-align: left;
        font-size: 13px;
        font-weight: 600;
    }

    .pagina-formulario .formulario-contenedor input[type="email"],
    .pagina-formulario .formulario-contenedor input[type="password"] {
        display: block !important;
        width: 100% !important;
        height: 38px !important;
        padding: 7px 12px !important;
        box-sizing: border-box !important;
        border: 1px solid #b7a5ae !important;
        border-radius: 7px !important;
        background: white !important;
        font-size: 14px !important;
    }

    .pagina-formulario .formulario-contenedor .no-robot {
        display: flex !important;
        width: 100%;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin: 2px 0;
        font-size: 11px;
        font-weight: 400;
    }

    .pagina-formulario .formulario-contenedor .no-robot input {
        width: auto !important;
        height: auto !important;
    }

    .pagina-formulario .formulario-contenedor button[type="submit"] {
        width: 100% !important;
        min-height: 68px !important;
        height: auto !important;
        margin-top: 5px;
        padding: 8px 15px !important;
        box-sizing: border-box !important;
        border: none;
        border-radius: 13px;
        background: #f3a3c2;
        color: white;
        display: flex !important;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: "Fredoka", sans-serif;
        font-size: 16px;
        cursor: pointer;
    }

    .pagina-formulario .formulario-contenedor button[type="submit"] img {
        width: 52px !important;
        height: 52px !important;
        object-fit: contain !important;
        max-width: 52px !important;
    }

    .pagina-formulario .enlace-formulario {
        margin-top: 7px;
        font-size: 13px;
    }

    @media (max-width: 430px) {
        .pagina-formulario .formulario-contenedor {
            width: 100%;
            padding: 14px 15px 17px;
        }

        .pagina-formulario .logo-formulario {
            width: 125px !important;
            height: 125px !important;
        }

        .pagina-formulario .formulario-contenedor h1 {
            font-size: 20px;
        }

        .pagina-formulario .formulario-contenedor h2 {
            font-size: 15px;
        }

        .pagina-formulario .formulario-contenedor button[type="submit"] {
            min-height: 62px !important;
        }

        .pagina-formulario .formulario-contenedor button[type="submit"] img {
            width: 46px !important;
            height: 46px !important;
        }
    }
</style>

</head>


<body class="pagina-formulario">


<div class="formulario-contenedor">


    <a
        href="{{ url_for('tienda') }}"
        class="volver"
    >

        ← Volver

    </a>


    <img
        class="logo-formulario"
        src="{{ url_for('static', filename='img/logo.png') }}"
        alt="Logo"
    >


    <h1>

        ¿Ya tienes una cuenta?

    </h1>


    <h2>

        Inicia sesión 🐾

    </h2>


    {% if error %}

        <div class="error-formulario">

            {{ error }}

        </div>

    {% endif %}


    {% if mensaje %}

        <div class="exito-formulario">

            {{ mensaje }}

        </div>

    {% endif %}


    <form
    action="{{ url_for('login') }}"
    method="POST"
>


        <label>

            Correo electrónico

        </label>


        <input
            type="email"
            name="usuario"
            required
        >


        <label>

            Contraseña

        </label>


        <input
            type="password"
            name="password"
            required
        >


        <label class="no-robot">

            <input
                type="checkbox"
                name="no_robot"
                value="1"
                required
            >

            Verifico que no soy un robot

        </label>


        <button
            type="submit"
            class="boton-principal"
        >

            <img
                src="{{ url_for('static', filename='img/Candado.png') }}"
                alt=""
            >

            Entrar

        </button>


    </form>


    <p class="enlace-formulario">

        ¿Eres nuevo aquí?

    </p>


    <a
        href="{{ url_for('registrar') }}"
        class="boton-secundario"
    >

        Registrarme

    </a>


</div>


</body>

</html>
