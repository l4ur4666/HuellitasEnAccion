<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <style>

        body{
            background:#ffdff1;
            font-family:Arial, sans-serif;
        }

        .contenedor{
            width:350px;
            margin:80px auto;
            background:white;
            padding:30px;
            border-radius:20px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
            color:#7ec8f8;
        }

        input{
            width:100%;
            box-sizing:border-box;
            padding:10px;
            margin-top:15px;
            border-radius:10px;
            border:1px solid #ccc;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:10px;
            background:#7ec8f8;
            color:white;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }

        p{
            text-align:center;
            margin-top:20px;
        }

        a{
            color:#7ec8f8;
            text-decoration:none;
        }

        .error{
            color:#d33;
            text-align:center;
            margin-top:15px;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <h2>Iniciar Sesión</h2>

    <form action="/login" method="POST">

        <input
            type="text"
            name="usuario"
            placeholder="Usuario"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Contraseña"
            required
        >

        <button type="submit">
            Ingresar
        </button>

    </form>

    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}

    <p>

        ¿No tienes cuenta?

        <a href="/registro">

            Regístrate

        </a>

    </p>

</div>

</body>
</html>
