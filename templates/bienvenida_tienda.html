<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Huellitas En Acción</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background-image: url("/static/img/bienvenida.jpeg");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .contenedor {
            text-align: center;

            padding: 30px 35px;

            background-color: #bfe7ff;

            border-radius: 22px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);

            width: 420px;
            max-width: 90%;
        }

        h1 {
            color: white;

            font-size: 30px;

            line-height: 1.2;

            margin-bottom: 18px;
        }

        p {
            color: white;

            font-size: 18px;

            margin-bottom: 5px;
        }

        .boton-redireccion {
            background-color: #f7a0f7;

            color: white;

            padding: 12px 25px;

            display: inline-block;

            margin-top: 22px;

            border-radius: 12px;

            text-decoration: none;

            font-size: 17px;

            font-weight: bold;
        }

        .boton-redireccion:hover {
            background-color: #e889e8;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <h1>
            🐾 ¡Bienvenido a<br>
            Huellitas En Acción! 🐾
        </h1>

        <p>
            Tu mascota, nuestra misión 💗
        </p>

        <a href="/tienda" class="boton-redireccion">
            Entrar a la tienda 🛍️
        </a>

    </div>

</body>

</html>
