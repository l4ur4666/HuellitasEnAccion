<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Nueva contraseña
    </title>

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilos.css') }}"
    >

    <style>

        .pagina-nueva-contrasena {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .contenedor-nueva-contrasena {
            width: min(520px, 100%);
            padding: 30px;
            box-sizing: border-box;
            background: #fff8fc;
            border: 3px solid #f3a3c2;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(120, 70, 100, 0.15);
            text-align: center;
        }

        .logo-nueva-contrasena {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 5px;
        }

        .contenedor-nueva-contrasena h1 {
            margin: 5px 0 8px;
            color: #75445b;
            font-family: "Fredoka", sans-serif;
            font-size: 26px;
        }

        .contenedor-nueva-contrasena p {
            margin: 0 0 20px;
            color: #5c5060;
            font-family: "Quicksand", sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        .contenedor-nueva-contrasena form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .contenedor-nueva-contrasena label {
            text-align: left;
            color: #5c5060;
            font-family: "Quicksand", sans-serif;
            font-size: 14px;
            font-weight: 600;
        }

        .contenedor-nueva-contrasena input[type="password"] {
            width: 100%;
            height: 42px;
            padding: 8px 12px;
            box-sizing: border-box;
            border: 1px solid #b7a5ae;
            border-radius: 9px;
            background: white;
            font-size: 14px;
        }

        .boton-nueva-contrasena {
            width: 100%;
            min-height: 52px;
            margin-top: 6px;
            border: none;
            border-radius: 14px;
            background: #f3a3c2;
            color: white;
            font-family: "Fredoka", sans-serif;
            font-size: 17px;
            cursor: pointer;
        }

        .boton-nueva-contrasena:hover {
            opacity: 0.9;
        }

        .error-nueva-contrasena {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
            background: #ffe3ec;
            color: #a43f63;
            font-family: "Quicksand", sans-serif;
            font-size: 13px;
        }

        @media (max-width: 430px) {

            .contenedor-nueva-contrasena {
                padding: 22px 18px;
            }

            .logo-nueva-contrasena {
                width: 120px;
                height: 120px;
            }

            .contenedor-nueva-contrasena h1 {
                font-size: 22px;
            }

        }

    </style>

</head>


<body class="pagina-nueva-contrasena">


    <div class="contenedor-nueva-contrasena">


        <img
            src="{{ url_for('static', filename='img/logo.png') }}"
            class="logo-nueva-contrasena"
            alt="Huellitas En Acción"
        >


        <h1>
            Crea una nueva contraseña 🐾
        </h1>


        <p>
            Escribe tu nueva contraseña y confírmala
            para recuperar tu cuenta.
        </p>


        {% if error %}

            <div class="error-nueva-contrasena">
                {{ error }}
            </div>

        {% endif %}


        <form
            action="{{ url_for('nueva_contrasena') }}"
            method="POST"
        >

            <label for="password">
                Nueva contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="6"
                required
            >


            <label for="confirmar_password">
                Confirmar nueva contraseña
            </label>

            <input
                type="password"
                id="confirmar_password"
                name="confirmar_password"
                minlength="6"
                required
            >


            <button
                type="submit"
                class="boton-nueva-contrasena"
            >
                🔐 Cambiar contraseña
            </button>

        </form>


    </div>


</body>

</html>
