<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eliminar usuario</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilos.css') }}"
    >

    <style>

        /* =====================================================
           ELIMINAR USUARIO
           ===================================================== */

        .pagina-formulario .eliminar-contenedor {
            width: min(560px, calc(100% - 30px));
            box-sizing: border-box;
        }

        .pagina-formulario .eliminar-contenedor .icono-titulo {
            width: 82px !important;
            height: 82px !important;
            object-fit: contain !important;
            display: block !important;
            margin: 8px auto 12px !important;
        }

        .pagina-formulario .eliminar-contenedor h1 {
            margin: 5px auto 12px;
            max-width: 470px;
            font-size: 25px;
            line-height: 1.25;
            text-align: center;
        }

        .pagina-formulario .texto-eliminar {
            margin: 0 auto 18px;
            text-align: center;
            font-size: 15px;
        }

        .pagina-formulario .eliminar-contenedor form {
            width: 100%;
            box-sizing: border-box;
        }

        .pagina-formulario .confirmaciones-eliminar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin: 5px 0 18px;
        }

        .pagina-formulario .confirmacion {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;

            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }

        .pagina-formulario .confirmacion input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
            flex: 0 0 auto;
        }

        .pagina-formulario .botones-eliminar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .pagina-formulario .boton-secundario,
        .pagina-formulario .boton-eliminar {
            width: 100%;
            min-height: 64px;
            box-sizing: border-box;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;
            text-decoration: none;

            font-family: "Fredoka", sans-serif;
            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
        }

        .pagina-formulario .boton-secundario {
            background: #f8d8e6;
            color: #775078;
            border: none;
        }

        .pagina-formulario .boton-secundario:hover {
            background: #f3c8dc;
        }

        .pagina-formulario .boton-eliminar {
            padding: 8px 18px;
            gap: 12px;

            background: #f3a3c2;
            color: white;

            border: none;
        }

        .pagina-formulario .boton-eliminar:hover {
            background: #ea8fb4;
        }

        .pagina-formulario .boton-eliminar img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            display: block;
            flex: 0 0 auto;
        }

        .pagina-formulario .boton-eliminar span {
            white-space: nowrap;
        }

        @media (min-width: 600px) {

            .pagina-formulario .botones-eliminar {
                flex-direction: row;
                align-items: stretch;
            }

            .pagina-formulario .boton-secundario,
            .pagina-formulario .boton-eliminar {
                flex: 1;
            }

        }

        @media (max-width: 430px) {

            .pagina-formulario .eliminar-contenedor {
                width: calc(100% - 20px);
            }

            .pagina-formulario .eliminar-contenedor .icono-titulo {
                width: 68px !important;
                height: 68px !important;
            }

            .pagina-formulario .eliminar-contenedor h1 {
                font-size: 21px;
            }

            .pagina-formulario .texto-eliminar {
                font-size: 14px;
            }

            .pagina-formulario .boton-secundario,
            .pagina-formulario .boton-eliminar {
                min-height: 60px;
                font-size: 15px;
            }

            .pagina-formulario .boton-eliminar img {
                width: 40px;
                height: 40px;
            }

        }

    </style>

</head>


<body class="pagina-formulario">


<div class="formulario-contenedor eliminar-contenedor">


    <a
        href="{{ url_for('tienda') }}"
        class="volver"
    >
        ← Volver
    </a>


    <img
        class="icono-titulo"
        src="{{ url_for('static', filename='img/Basura.png') }}"
        alt="Eliminar usuario"
    >


    <h1>
        ¿Estás seguro de que quieres
        eliminar tu usuario?
    </h1>


    <p class="texto-eliminar">
        Esta acción desactivará tu cuenta.
    </p>


    {% if error %}

        <div class="error-formulario">
            {{ error }}
        </div>

    {% endif %}


    <form
        action="{{ url_for('eliminar_usuario') }}"
        method="POST"
    >


        <div class="confirmaciones-eliminar">

            <label class="confirmacion">

                <input
                    type="checkbox"
                    name="confirmar"
                    value="1"
                    required
                >

                <span>
                    Sí, deseo eliminar mi cuenta
                </span>

            </label>


            <label class="confirmacion">

                <input
                    type="checkbox"
                    name="no_robot"
                    value="1"
                    required
                >

                <span>
                    Verifico que no soy un robot
                </span>

            </label>

        </div>


        <div class="botones-eliminar">


            <a
                href="{{ url_for('tienda') }}"
                class="boton-secundario"
            >
                No, volver
            </a>


            <button
                type="submit"
                class="boton-eliminar"
            >

                <img
                    src="{{ url_for('static', filename='img/Basura.png') }}"
                    alt=""
                >

                <span>
                    Sí, eliminar
                </span>

            </button>


        </div>


    </form>


</div>


</body>

</html>
