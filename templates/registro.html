<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🐾 Crear Cuenta - Huellitas En Acción</title>


    <style>

        body {

            background: #ffdff1;

            font-family: Arial, sans-serif;

        }


        .contenedor {

            width: 350px;

            margin: 80px auto;

            background: white;

            padding: 30px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 0 10px rgba(0,0,0,.15);

        }


        h2 {

            color: #7ec8f8;

        }


        input {

            width: 90%;

            padding: 10px;

            margin: 10px 0;

            border-radius: 10px;

            border: 1px solid #ccc;

        }


        button {

            width: 95%;

            padding: 10px;

            background: #7ec8f8;

            color: white;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-size: 16px;

        }


        button:hover {

            background: #65b8ec;

        }


        a {

            text-decoration: none;

            color: #7ec8f8;

        }

    </style>

</head>


<body>


<div class="contenedor">


    <h2>

        🐾 Crear Cuenta 💖

    </h2>


    <form
        action="/registro"
        method="POST"
    >


  <input
    type="text"
    name="nombre"
    placeholder="👤 Nombre"
    required
>

<input
    type="text"
    name="apellidos"
    placeholder="👤 Apellidos"
    required
>

<input
    type="email"
    name="correo"
    placeholder="📧 Correo"
    required
>

<input
    type="password"
    name="password"
    placeholder="🔒 Contraseña"
    required
>


        <button type="submit">

            🐾 Registrarse

        </button>


    </form>


    <br><br>


    <a href="/login">

        🔐 Ya tengo cuenta

    </a>


</div>


</body>

</html>
