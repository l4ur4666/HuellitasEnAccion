<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Actualizar usuario
    </title>


    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilos.css') }}"
    >
    <style>
    /* =====================================================
       AJUSTES EXCLUSIVOS DE ACTUALIZAR USUARIO
       ===================================================== */

    .pagina-formulario .formulario-contenedor {
        width: min(520px, 100%);
    }

    .pagina-formulario .icono-titulo {
        width: 85px !important;
        height: 85px !important;
        object-fit: contain !important;
        display: block !important;
        margin: 5px auto 8px !important;
    }

    .pagina-formulario .formulario-contenedor h1 {
        margin: 5px 0 15px;
        font-size: 25px;
    }

    .pagina-formulario .formulario-contenedor form {
        display: flex !important;
        flex-direction: column !important;
        gap: 8px !important;
        width: 100%;
    }

    .pagina-formulario .formulario-contenedor label {
        display: block;
        width: 100%;
        text-align: left;
        font-size: 13px;
        font-weight: 600;
    }

    .pagina-formulario .formulario-contenedor input[type="text"],
    .pagina-formulario .formulario-contenedor input[type="email"],
    .pagina-formulario .formulario-contenedor input[type="password"] {
        display: block !important;
        width: 100% !important;
        height: 38px !important;
        padding: 7px 12px !important;
        box-sizing: border-box !important;
        border: 1px solid #b7a5ae !important;
        border-radius: 7px !important;
        background: white !important;
        font-size: 14px !important;
    }

    .pagina-formulario .formulario-contenedor .no-robot {
        display: flex !important;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin: 3px 0;
        font-size: 11px;
        font-weight: 400;
    }

    .pagina-formulario .formulario-contenedor .no-robot input {
        width: auto !important;
        height: auto !important;
    }

    .pagina-formulario .formulario-contenedor .boton-principal {
        width: 100% !important;
        min-height: 68px !important;
        margin-top: 5px;
        padding: 8px 15px !important;
        box-sizing: border-box !important;
        border-radius: 13px !important;
        display: flex !important;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: "Fredoka", sans-serif;
        font-size: 16px;
    }

    .pagina-formulario .formulario-contenedor .boton-principal img {
        width: 52px !important;
        height: 52px !important;
        object-fit: contain !important;
    }

    @media (max-width: 430px) {
        .pagina-formulario .formulario-contenedor {
            width: 100%;
        }

        .pagina-formulario .icono-titulo {
            width: 70px !important;
            height: 70px !important;
        }

        .pagina-formulario .formulario-contenedor h1 {
            font-size: 20px;
        }

        .pagina-formulario .formulario-contenedor .boton-principal {
            min-height: 62px !important;
        }

        .pagina-formulario .formulario-contenedor .boton-principal img {
            width: 46px !important;
            height: 46px !important;
        }
    }
    /* BOTÓN ACTUALIZAR — SOLO ESTA PÁGINA */
.pagina-formulario .formulario-contenedor form .boton-principal {
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;

    width: 100% !important;
    min-height: 68px !important;
    height: 68px !important;

    position: relative !important;
    z-index: 10 !important;

    align-items: center !important;
    justify-content: center !important;
    gap: 12px !important;

    margin: 8px 0 0 !important;
    padding: 8px 15px !important;

    background: #f3a3c2 !important;
    color: white !important;

    border: none !important;
    border-radius: 13px !important;

    font-family: "Fredoka", sans-serif !important;
    font-size: 16px !important;
    cursor: pointer !important;
}

.pagina-formulario .formulario-contenedor form .boton-principal img {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;

    width: 52px !important;
    height: 52px !important;
    object-fit: contain !important;
}
</style>

</head>


<body class="pagina-formulario">


<div class="formulario-contenedor">


    <a
        href="{{ url_for('tienda') }}"
        class="volver"
    >

        ← Volver a la tienda

    </a>


    <img
        class="icono-titulo"
        src="{{ url_for('static', filename='img/Usuario.png') }}"
        alt=""
    >


    <h1>

        Actualizar usuario

    </h1>


    {% if error %}

        <div class="error-formulario">

            {{ error }}

        </div>

    {% endif %}


    <form method="POST">


        <label>

            Nombre

        </label>


        <input
            type="text"
            name="nombre"
            value="{{ usuario.nombres }}"
            required
        >


        <label>

            Apellidos

        </label>


        <input
            type="text"
            name="apellidos"
            value="{{ usuario.apellidos }}"
            required
        >


        <label>

            Correo electrónico

        </label>


        <input
            type="email"
            name="correo"
            value="{{ usuario.email }}"
            required
        >


        <label>

            Nueva contraseña

        </label>


        <input
            type="password"
            name="password"
            placeholder="Déjalo vacío si no deseas cambiarla"
        >


        <label class="no-robot">

            <input
                type="checkbox"
                name="no_robot"
                value="1"
                required
            >

            Verifico que no soy un robot

        </label>


        <button type="submit">
    <img
        src="{{ url_for('static', filename='img/Lapiz.png') }}"
        alt=""
    >
    Actualizar usuario
</button>


    </form>


</div>


</body>

</html>
