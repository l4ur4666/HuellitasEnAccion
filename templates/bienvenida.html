<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🐾 Bienvenido - Huellitas En Acción</title>


    <style>

        body {

            margin: 0;

            background: #ffdff1;

            font-family: Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

        }


        .contenedor {

            background: white;

            width: 400px;

            padding: 40px;

            border-radius: 25px;

            text-align: center;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);

        }


        .huella {

            font-size: 65px;

        }


        h1 {

            color: #7ec8f8;

            font-size: 30px;

        }


        p {

            color: #666;

            font-size: 18px;

        }


        .boton {

            display: inline-block;

            margin-top: 20px;

            padding: 14px 25px;

            background: #7ec8f8;

            color: white;

            text-decoration: none;

            border-radius: 15px;

            font-size: 18px;

            font-weight: bold;

        }


        .boton:hover {

            background: #65b8ec;

        }

    </style>

</head>


<body>


<div class="contenedor">


    <div class="huella">

        🐾

    </div>


    <h1>

        💖 ¡Bienvenido/a, {{ nombre }}! 💖

    </h1>


    <p>

        Has iniciado sesión correctamente. ✨

    </p>


    <p>

        ¡Nos alegra tenerte en

        <b>Huellitas En Acción</b>! 🐶🐱

    </p>


    <a
        href="/"
        class="boton"
    >

        🏠 Entrar a la tienda

    </a>


</div>


</body>

</html>
